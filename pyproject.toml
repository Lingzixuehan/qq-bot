[project]
name = "qq-bot"
version = "1.0.0"
description = "一个基于NoneBot2的QQ娱乐机器人"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "nonebot2[fastapi]>=2.2.0",
    "nonebot-adapter-onebot>=2.4.0",
    "aiosqlite>=0.19.0",
]
requires-python = ">=3.8"

[tool.nonebot]
plugins = []
plugin_dirs = ["plugins"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_api"
